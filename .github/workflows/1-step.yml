# Name is Step x, where x is the last step number in the exercise.
name: Step 1

# Set these variables to have the correct exercise name and module title.
env:
  EXERCISE_NAME: "ai-training-instructing-agents"
  MODULE_TITLE: "Instructing Agents"

# Trigger when any of the three deliverable files are pushed.
on:
  push:
    paths:
      - 'CLAUDE.md'
      - 'app/CLAUDE.md'
      - 'docs/ReviewFindings.md'
      - 'docs/ImprovementPlan.md'

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  check_initial_commit:
    name: Check if initial commit
    runs-on: ubuntu-latest
    outputs:
      is-initial: ${{ steps.check.outputs.is-initial }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit count
        id: check
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "is-initial=$([[ $commit_count -eq 1 ]] && echo true || echo false)" >> $GITHUB_OUTPUT

  find_exercise:
    name: Find Exercise Issue
    needs: check_initial_commit
    if: needs.check_initial_commit.outputs.is-initial == 'false'
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.8.1

  post_checking_message:
    name: Post checking work message
    needs: [find_exercise]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Post checking work message
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/markdown-templates/exercise/checking-work.md

  # Validates all three exercise deliverables.
  check_exercise_files:
    name: Check Exercise Deliverables
    runs-on: ubuntu-latest
    needs: post_checking_message
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check docs/ReviewFindings.md
        run: |
          if [ ! -f "docs/ReviewFindings.md" ]; then
            echo "Error: docs/ReviewFindings.md not found."
            exit 1
          fi
          if [ ! -s "docs/ReviewFindings.md" ]; then
            echo "Error: docs/ReviewFindings.md is empty."
            exit 1
          fi
          echo "docs/ReviewFindings.md OK"

      - name: Check docs/ImprovementPlan.md
        run: |
          if [ ! -f "docs/ImprovementPlan.md" ]; then
            echo "Error: docs/ImprovementPlan.md not found."
            exit 1
          fi
          if [ ! -s "docs/ImprovementPlan.md" ]; then
            echo "Error: docs/ImprovementPlan.md is empty."
            exit 1
          fi
          echo "docs/ImprovementPlan.md OK"

      - name: Check CLAUDE.md
        run: |
          if [ -f "CLAUDE.md" ]; then
            CLAUDE_PATH="CLAUDE.md"
          elif [ -f "app/CLAUDE.md" ]; then
            CLAUDE_PATH="app/CLAUDE.md"
          else
            echo "Error: CLAUDE.md not found. Create it in the repository root or app directory."
            exit 1
          fi
          # Must have at least 5 non-empty lines
          non_empty=$(grep -c '[^[:space:]]' "$CLAUDE_PATH" || true)
          if [ "$non_empty" -lt 5 ]; then
            echo "Error: $CLAUDE_PATH has only $non_empty non-empty lines. Add your tech stack, architecture rules, and constraints (minimum 5 lines)."
            exit 1
          fi
          # Must contain at least one constraint keyword
          if ! grep -qiE '\bnot\b|\bavoid\b|\bnever\b' "$CLAUDE_PATH"; then
            echo "Error: $CLAUDE_PATH does not appear to contain any constraints. Add at least two things Claude must not change."
            exit 1
          fi
          echo "$CLAUDE_PATH OK ($non_empty non-empty lines)"

  post_final_content:
    name: Post final content
    needs: [find_exercise, check_exercise_files]
    if: needs.check_exercise_files.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disable current workflow
        run: |
          gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, check_exercise_files]
    if: needs.check_exercise_files.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build final comment from local template
        id: build-final-comment
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/markdown-templates/exercise/exercise-finished.md
          template-vars: |
            title: ${{ env.MODULE_TITLE }}
            login: ${{ github.actor }}
            repo_full_name: ${{ github.repository }}

      - name: Build final README from local template
        id: build-final-readme
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/markdown-templates/readme/exercise-finished.md
          template-vars: |
            login: ${{ github.actor }}
            issue_url: ${{ env.ISSUE_URL }}

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment with final message
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          body: ${{ steps.build-final-comment.outputs.updated-text }}
          edit-mode: replace

      - name: Close issue
        run: |
          gh issue close ${{ env.ISSUE_NUMBER }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README
        env:
          README_TEXT: ${{ steps.build-final-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md"
          message: "Congratulations!🎉"
          default_author: github_actions

  post_mistake_message:
    name: Post mistake message
    needs: [find_exercise, check_exercise_files]
    if: always() && needs.check_exercise_files.result == 'failure'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    # Set the feedback message to a proper one in the 'Build mistake message from local template' step.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build mistake message from local template
        id: build-mistake-message
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/markdown-templates/exercise/step-mistake.md
          template-vars: |
            feedback_message: "One or more deliverables are missing or incomplete. Check that all three files exist and are not empty: `docs/ReviewFindings.md`, `docs/ImprovementPlan.md`, and `CLAUDE.md`. Also make sure `CLAUDE.md` has at least 5 non-empty lines and includes constraints (words like `not`, `avoid`, or `never`)."

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment with mistake message
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          body: ${{ steps.build-mistake-message.outputs.updated-text }}
          edit-mode: replace
